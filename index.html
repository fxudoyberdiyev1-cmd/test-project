<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СКУД - Ишчиларни Фильтрлаш</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
        <div class="flex items-center justify-between border-b border-gray-700 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
                📊 СКУД Тизими: Ишчиларни Фильтрлаш
            </h1>
            <span class="bg-blue-900/50 text-blue-300 text-xs px-3 py-1 rounded-full border border-blue-700">v1.0.0</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="flex flex-col gap-1">
                <label class="text-sm text-gray-400 font-medium">Excel файлни танланг:</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" 
                       class="bg-gray-700 p-2 rounded-lg border border-gray-600 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm text-gray-400 font-medium">Бўлим номи:</label>
                <input type="text" id="deptInput" placeholder="Масалан: IT, Кончилик..." 
                       class="bg-gray-700 p-2 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm text-gray-400 font-medium">Минимал иш соати:</label>
                <input type="number" id="hoursInput" placeholder="Масалан: 8" 
                       class="bg-gray-700 p-2 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 text-sm">
            </div>
        </div>

        <div class="flex gap-3 mb-6">
            <button onclick="applyFilters()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2 rounded-lg transition text-sm cursor-pointer shadow-lg">
                🔍 Фильтрлашни бошлаш
            </button>
            <button onclick="downloadFiltered()" id="downloadBtn" disabled class="bg-emerald-700 opacity-50 text-white font-medium px-5 py-2 rounded-lg transition text-sm cursor-not-allowed shadow-lg">
                📥 Натижани юклаб олиш (Excel)
            </button>
        </div>

        <div id="statusMessage" class="text-sm text-gray-400 mb-3 hidden"></div>
        
        <div class="overflow-x-auto rounded-lg border border-gray-700">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-700/50 border-b border-gray-700 text-gray-300">
                        <th class="p-3 font-semibold">ИД</th>
                        <th class="p-3 font-semibold">Ф.И.Ш.</th>
                        <th class="p-3 font-semibold">Бўлим</th>
                        <th class="p-3 font-semibold">Иш соати</th>
                        <th class="p-3 font-semibold">Ҳолат</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-800">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-gray-500 italic">Маълумот кўриш учун аввал Excel файл юкланг...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let originalData = [];
        let filteredData = [];

        // Файлни ўқиб олиш
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // СКУД маълумотларини JSON форматга ўтказиш
                originalData = XLSX.utils.sheet_to_json(worksheet);
                filteredData = [...originalData];
                
                document.getElementById('statusMessage').classList.remove('hidden');
                document.getElementById('statusMessage').innerText = `Базадан жами ${originalData.length} та ишчи юкланди.`;
                
                renderTable(filteredData);
            };
            reader.readAsArrayBuffer(file);
        });

        // Фильтрларни қўллаш
        function applyFilters() {
            if (originalData.length === 0) {
                alert("Илтимос, аввал СКУД Excel файлини юкланг!");
                return;
            }

            const deptValue = document.getElementById('deptInput').value.toLowerCase().trim();
            const hoursValue = parseFloat(document.getElementById('hoursInput').value);

            filteredData = originalData.filter(row => {
                // Устун номларини СКУД файлингизга мос ҳолда текширинг
                const rowDept = String(row['Бўлим'] || row['Отдел'] || '').toLowerCase();
                const rowHours = parseFloat(row['Иш соати'] || row['Время'] || 0);

                const matchDept = !deptValue || rowDept.includes(deptValue);
                const matchHours = isNaN(hoursValue) || rowHours >= hoursValue;

                return matchDept && matchHours;
            });

            document.getElementById('statusMessage').innerText = `Фильтр натижаси: ${filteredData.length} та ходим топилди.`;
            
            // Натижа юклаш тугмасини активлаштириш
            const downloadBtn = document.getElementById('downloadBtn');
            if (filteredData.length > 0) {
                downloadBtn.disabled = false;
                downloadBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2 rounded-lg transition text-sm cursor-pointer shadow-lg";
            } else {
                downloadBtn.disabled = true;
                downloadBtn.className = "bg-emerald-700 opacity-50 text-white font-medium px-5 py-2 rounded-lg transition text-sm cursor-not-allowed shadow-lg";
            }

            renderTable(filteredData);
        }

        // Жадвални экранга чиқариш
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400 italic">Қидирув бўйича ходим топилмади.</td></tr>`;
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-700/30 transition text-gray-300";
                tr.innerHTML = `
                    <td class="p-3">${row['ИД'] || row['ID'] || '-'}</td>
                    <td class="p-3 font-medium text-white">${row['Ф.И.Ш.'] || row['ФИО'] || row['Исм'] || '-'}</td>
                    <td class="p-3">${row['Бўлим'] || row['Отдел'] || '-'}</td>
                    <td class="p-3"><span class="bg-gray-800 px-2 py-0.5 rounded text-blue-400 font-mono">${row['Иш соати'] || row['Время'] || 0} с.</span></td>
                    <td class="p-3"><span class="text-emerald-400">✔️ Ишда</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Фильтрланган янги Excel файлни юклаб олиш
        function downloadFiltered() {
            if (filteredData.length === 0) return;
            
            const worksheet = XLSX.utils.json_to_sheet(filteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.book_append_sheet(workbook, worksheet, "Фильтрланган ишчилар");
            
            // Файлни компьютер хотирасига ёзиш
            XLSX.writeFile(workbook, "skud_filtrланган_ходимлар.xlsx");
        }
    </script>
</body>
</html>
