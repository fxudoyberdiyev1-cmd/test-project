<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKUD Analytics - Zarmiton & Gujumsoy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .dark { background-color: #111827; color: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [data, setData] = useState([]);
            const [stats, setStats] = useState(null);
            const [search, setSearch] = useState("");
            const [darkMode, setDarkMode] = useState(false);

            const toggleTheme = () => {
                setDarkMode(!darkMode);
                if (!darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const jsonData = XLSX.utils.sheet_to_json(ws, { defval: "" });
                    processData(jsonData);
                };
                reader.readAsBinaryString(file);
            };

            const processData = (rawData) => {
                let totalHours = 0;
                let notExited = 0;
                const workerHours = {};

                const processed = rawData.map(row => {
                    let ishlaganSoat = 0;
                    let status = row["Chiqqan vaqt"];

                    if (!status || status.toString().trim() === "") {
                        status = "CHIQMAGAN";
                        notExited++;
                    } else if (row["Kirgan vaqt"] && row["Chiqqan vaqt"]) {
                        const parseTime = (t) => {
                            if (typeof t === 'number') return t * 24; 
                            const parts = t.toString().split(":");
                            if (parts.length >= 2) return parseInt(parts[0]) + parseInt(parts[1]) / 60;
                            return 0;
                        };
                        const start = parseTime(row["Kirgan vaqt"]);
                        const end = parseTime(row["Chiqqan vaqt"]);
                        if (end >= start) {
                            ishlaganSoat = parseFloat((end - start).toFixed(2));
                            totalHours += ishlaganSoat;
                        }
                    }

                    const name = row["F.I.SH"] || "Noma'lum";
                    workerHours[name] = (workerHours[name] || 0) + ishlaganSoat;

                    return { ...row, Status_Chiqqan: status, Ishlagan_soat: ishlaganSoat };
                });

                let bestWorker = "";
                let maxHours = -1;
                for (const [name, hours] of Object.entries(workerHours)) {
                    if (hours > maxHours) { maxHours = hours; bestWorker = name; }
                }

                setData(processed);
                setStats({
                    total_entries: processed.length,
                    not_exited: notExited,
                    total_hours: totalHours.toFixed(2),
                    best_worker: bestWorker || "Нет данных"
                });
            };

            const filteredData = data.filter(r => 
                (r["F.I.SH"] || "").toLowerCase().includes(search.toLowerCase()) ||
                (r.Status_Chiqqan === "CHIQMAGAN" && search.toLowerCase() === "chiqmagan")
            );

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        {/* Шапка */}
                        <div className="flex justify-between items-center">
                            <h1 className="text-3xl font-bold">SKUD Zarmiton & Gujumsoy Analytics</h1>
                            <button onClick={toggleTheme} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                {darkMode ? '☀️ Light Mode' : '🌙 Dark Mode'}
                            </button>
                        </div>

                        {/* Загрузка файла */}
                        <div className={`p-8 border-2 border-dashed rounded-xl text-center transition-colors ${darkMode ? 'border-gray-600 hover:border-gray-500' : 'border-gray-300 hover:border-gray-400'}`}>
                            <input 
                                type="file" 
                                accept=".xlsx, .xls" 
                                onChange={handleFileUpload} 
                                className="block w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                            />
                            <p className="mt-4 text-sm text-gray-400">Выберите Excel файл с колонками: F.I.SH, Kirgan vaqt, Chiqqan vaqt, Filial, Eshik, Sana</p>
                        </div>

                        {/* Дашборд */}
                        {stats && (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className={`p-6 rounded-xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <h3 className="text-sm text-gray-400">Всего записей</h3>
                                    <p className="text-2xl font-bold text-blue-500">{stats.total_entries}</p>
                                </div>
                                <div className={`p-6 rounded-xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <h3 className="text-sm text-gray-400">Не вышли (CHIQMAGAN)</h3>
                                    <p className="text-2xl font-bold text-red-500">{stats.not_exited}</p>
                                </div>
                                <div className={`p-6 rounded-xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <h3 className="text-sm text-gray-400">Всего отработано часов</h3>
                                    <p className="text-2xl font-bold text-green-500">{stats.total_hours} ч.</p>
                                </div>
                                <div className={`p-6 rounded-xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <h3 className="text-sm text-gray-400">Топ работник</h3>
                                    <p className="text-xl font-bold text-purple-500">{stats.best_worker}</p>
                                </div>
                            </div>
                        )}

                        {/* Таблица */}
                        {data.length > 0 && (
                            <div className={`p-4 rounded-xl shadow-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <input 
                                    type="text" 
                                    placeholder="Поиск по Ф.И.О или статусу..." 
                                    value={search} 
                                    onChange={e => setSearch(e.target.value)} 
                                    className={`mb-4 p-3 w-full md:w-1/3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} 
                                />
                                
                                <div className="overflow-auto max-h-[500px]">
                                    <table className="w-full text-left text-sm border-collapse">
                                        <thead className={`sticky top-0 ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}>
                                            <tr>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">F.I.SH</th>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">Sana</th>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">Kirgan vaqt</th>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">Chiqqan vaqt</th>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">Filial</th>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">Eshik</th>
                                                <th className="p-3 border-b border-gray-200 dark:border-gray-700">Ishlagan soat</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredData.map((row, i) => (
                                                <tr key={i} className={`border-b transition-colors ${darkMode ? 'border-gray-700 hover:bg-gray-750' : 'border-gray-200 hover:bg-gray-50'}`}>
                                                    <td className="p-3">{row["F.I.SH"]}</td>
                                                    <td className="p-3">{row["Sana"]}</td>
                                                    <td className="p-3">{row["Kirgan vaqt"]}</td>
                                                    <td className={`p-3 font-medium ${row.Status_Chiqqan === 'CHIQMAGAN' ? 'text-red-500' : ''}`}>{row.Status_Chiqqan}</td>
                                                    <td className="p-3">{row["Filial"]}</td>
                                                    <td className="p-3">{row["Eshik"]}</td>
                                                    <td className="p-3 font-semibold">{row.Ishlagan_soat}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
