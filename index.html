<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СКУД - Ишчиларни Фильтрлаш</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between border-b border-gray-800 pb-5 mb-6">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">📊</span>
                <h1 class="text-2xl font-bold tracking-tight text-white">СКУД Тизими: Ишчиларни Саралаш (Зармитан / Гужумсой)</h1>
            </div>
            <span class="bg-blue-500/10 text-blue-400 text-xs px-2.5 py-1 rounded-full font-mono border border-blue-500/20">v1.0.0</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                <label class="block text-sm font-medium text-gray-400 mb-2">Excel файлни танланг:</label>
                <input type="file" id="fileInput" accept=".xlsx, .xls" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
            </div>

            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                <label class="block text-sm font-medium text-gray-400 mb-2">Минимал иш соати:</label>
                <input type="number" id="hoursInput" value="8" min="1" max="24" class="block w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white font-mono focus:outline-none focus:border-blue-500" />
            </div>

            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex items-end space-x-3">
                <button onclick="filterData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition active:scale-95 shadow-lg shadow-blue-600/10 flex items-center justify-center space-x-2 cursor-pointer">
                    <span>🔍 Фильтрлашни бошлаш</span>
                </button>
                <button onclick="downloadFiltered()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition active:scale-95 shadow-lg shadow-emerald-600/10 flex items-center justify-center cursor-pointer" title="Натижани Excel қилиб юклаб олиш">
                    <span>📥 Юклаш</span>
                </button>
            </div>
        </div>

        <div class="bg-gray-800/30 rounded-xl border border-gray-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800/80 text-gray-300 border-b border-gray-700 text-sm font-semibold">
                            <th class="p-3.5">ИД</th>
                            <th class="p-3.5">Ф.И.Ш.</th>
                            <th class="p-3.5">Бўлим</th>
                            <th class="p-3.5">Иш соати</th>
                            <th class="p-3.5">Ҳолат</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-800/50 text-sm">
                        <tr>
                            <td colspan="5" class="p-12 text-center text-gray-500 italic">Маълумот кўриш учун аввал Excel файл юкланг ва фильтрланг...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let excelData = [];
        let globalFilteredData = [];

        // Excel файлни ўқиш ва хотирага олиш
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Маълумотларни хавфсиз равишда JSON га ўтказиш
                    excelData = XLSX.utils.sheet_to_json(worksheet);
                    alert("Excel файл муваффақиятли юкланди! Энди фильтрлашни бошлашингиз мумкин.");
                } catch (error) {
                    alert("Файл ўқишда хатолик бўлди. Файл бузилмаганлигини текширинг.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Ходимларни соати бўйича хавфсиз фильтрлаш (Қотиб қолмайди)
        function filterData() {
            if (excelData.length === 0) {
                alert("Илтимос, аввал Excel файлни юкланг!");
                return;
            }

            const targetHours = parseFloat(document.getElementById('hoursInput').value) || 8;
            
            // Белгиланган иш соатидан кам ишлаган ходимларни саралаш
            globalFilteredData = excelData.filter(row => {
                // Турлича ёзилиши мумкин бўлган устун номларини текшириш
                const hoursRaw = row['Иш соати'] || row['Отработанные часы'] || row['Часы'] || row['Иш соат'] || 0;
                const hours = parseFloat(hoursRaw);
                return hours < targetHours;
            });

            renderTable(globalFilteredData);
        }

        // Саҳифадаги жадвалга чиқариш
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-emerald-400 italic font-medium">Белгиланган соатдан кам ишлаган қоидабузар ходимлар топилмади! 👍</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/40 transition text-gray-300";
                
                const id = row['ИД'] || row['ID'] || row['Табель'] || '-';
                const fio = row['Ф.И.Ш.'] || row['ФИО'] || row['Исми'] || row['Ходим'] || '-';
                const department = row['Бўлим'] || row['Отдел'] || row['Цех'] || '-';
                const hoursRaw = row['Иш соати'] || row['Отработанные часы'] || row['Часы'] || row['Иш соат'] || 0;

                tr.innerHTML = `
                    <td class="p-3 font-mono text-gray-400">${id}</td>
                    <td class="p-3 font-medium text-white">${fio}</td>
                    <td class="p-3 text-gray-400">${department}</td>
                    <td class="p-3"><span class="bg-gray-800 px-2.5 py-1 rounded text-blue-400 font-mono font-semibold">${hoursRaw} соат</span></td>
                    <td class="p-3"><span class="inline-flex items-center text-red-400 font-medium">⚠️ Кам ишлаган</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Фильтрланган янги Excel файлни компьютерникига юклаб олиш
        function downloadFiltered() {
            if (globalFilteredData.length === 0) {
                alert("Юклаб олиш учун аввал фильтрланган маълумот мавжуд бўлиши керак!");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(globalFilteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.book_append_sheet(workbook, worksheet, "Кам ишлаганлар");

            // Файлни СКУД номи билан автомат юклаш
            XLSX.writeFile(workbook, "skud_filtrланган_ходимлар.xlsx");
        }
    </script>
</body>
</html>
