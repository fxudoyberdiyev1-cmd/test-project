<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 col-span-2">
        <label class="block text-sm font-medium text-gray-400 mb-2">Excel файлни танланг:</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:bg-blue-600 file:text-white cursor-pointer" />
    </div>

    <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex items-end">
        <button onclick="processFile()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition active:scale-95">
            ✅ Тасдиқлаш
        </button>
    </div>

    <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex items-end">
        <button id="filterBtn" onclick="filterData()" disabled class="w-full bg-blue-600 opacity-50 cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg transition active:scale-95">
            🔍 Фильтрлаш
        </button>
    </div>
</div>

<script>
    // Файлни тасдиқлаш функцияси
    function processFile() {
        if (excelData.length === 0) {
            alert("Аввал файлни танланг!");
            return;
        }
        document.getElementById('filterBtn').disabled = false;
        document.getElementById('filterBtn').classList.remove('opacity-50', 'cursor-not-allowed');
        alert("Маълумотлар тасдиқланди. Энди фильтрлашни босинг.");
    }
    
    // filterData функцияси ичига қўшимча равишда экспорт тугмасини ҳам қўшишингиз мумкин
    // ... қолган қисми аввалгидек ...
</script>
