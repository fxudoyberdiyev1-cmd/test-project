<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СКУД - Ишчиларни Фильтрлаш</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between border-b border-gray-800 pb-5 mb-6">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">📊</span>
                <h1 class="text-2xl font-bold tracking-tight text-white">СКУД Тизими: Ишчиларни Саралаш (Зармитан / Gujumsoy)</h1>
            </div>
            <span class="bg-blue-500/10 text-blue-400 text-xs px-2.5 py-1 rounded-full font-mono border border-blue-500/20">v1.2.0</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                <label class="block text-sm font-medium text-gray-400 mb-2">Excel файлни танланг:</label>
                <input type="file" id="fileInput" accept=".xlsx, .xls" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
            </div>

            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                <label class="block text-sm font-medium text-gray-400 mb-2">Минимал иш соатидан камлар:</label>
                <input type="number" id="hoursInput" value="8" min="1" max="24" class="block w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white font-mono focus:outline-none focus:border-blue-500" />
            </div>

            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-800 flex items-end space-x-3">
                <button onclick="filterData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition active:scale-95 shadow-lg shadow-blue-600/10 flex items-center justify-center space-x-2 cursor-pointer">
                    <span>🔍 Фильтрлашни бошлаш</span>
                </button>
                <button onclick="downloadFiltered()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition active:scale-95 shadow-lg shadow-emerald-600/10 flex items-center justify-center cursor-pointer" title="Натижани Excel қилиб юклаб олиш">
                    <span>📥 Excel Юклаш</span>
                </button>
            </div>
        </div>

        <div id="statsPanel" class="hidden mb-4 p-3 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-xl text-sm font-medium">
            Умумий қаторлар: <span id="totalCount" class="font-bold">0</span> та. Кам ишлаган ходимлар: <span id="badCount" class="font-bold text-red-400">0</span> та.
        </div>

        <div class="bg-gray-800/30 rounded-xl border border-gray-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800/80 text-gray-300 border-b border-gray-700 text-sm font-semibold">
                            <th class="p-3.5">ИД (Табель)</th>
                            <th class="p-3.5">Ф.И.Ш. (Ходим)</th>
                            <th class="p-3.5">Бўлим (Цех)</th>
                            <th class="p-3.5">Иш соати</th>
                            <th class="p-3.5">Ҳолат</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-800/50 text-sm">
                        <tr>
                            <td colspan="5" class="p-12 text-center text-gray-500 italic">Маълумот кўриш учун аввал Excel файл юкланг ва фильтрланг...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let excelData = [];
        let globalFilteredData = [];

        // Устун қидириш функцияси
        function findValue(row, keys) {
            for (let key of Object.keys(row)) {
                const normalizedKey = key.toString().toLowerCase().trim().replace(/[\s_\.]/g, '');
                if (keys.some(k => normalizedKey.includes(k))) {
                    return row[key];
                }
            }
            return null;
        }

        // Матндан соф рақам ажратиб олиш функцияси
        function parseHours(val) {
            if (val === null || val === undefined) return 0;
            // Агар вергул бўлса нуқтага алмаштирамиз
            let str = val.toString().replace(',', '.').replace(/[^0-9\.]/g, '').trim();
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        // Excel ўқиш
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    excelData = XLSX.utils.sheet_to_json(worksheet);
                    alert("Excel юкланди! Жами қаторлар: " + excelData.length);
                } catch (error) {
                    alert("Файлни ўқишда хатолик.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Фильтрлаш
        function filterData() {
            if (excelData.length === 0) {
                alert("Илтимос, аввал Excel файлни юкланг!");
                return;
            }

            const targetHours = parseFloat(document.getElementById('hoursInput').value) || 8;

            globalFilteredData = excelData.filter(row => {
                const hoursVal = findValue(row, ['соат', 'часы', 'hours', 'ишсоат', 'отработанно', 'ишсоати', 'время', 'duration']);
                const hours = parseHours(hoursVal);
                
                const nameVal = findValue(row, ['фио', 'фиш', 'исм', 'ходим', 'имя', 'fio', 'fio']);
                if (!nameVal && hours === 0) return false; // Бўм-бўш қаторларни ташлаб юбориш

                return hours < targetHours;
            });

            document.getElementById('statsPanel').classList.remove('hidden');
            document.getElementById('totalCount').innerText = excelData.length;
            document.getElementById('badCount').innerText = globalFilteredData.length;

            renderTable(globalFilteredData);
        }

        // Экранга чиқариш
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-emerald-400 italic font-medium">Белгиланган соатдан кам ишлаган ходимлар топилмади! 👍</td></tr>';
                return;
            }

            data.forEach(row => {
                const id = findValue(row, ['ид', 'id', 'табель', 'номер', 'код', 'табельный']) || '-';
                const fio = findValue(row, ['фио', 'фиш', 'исм', 'ходим', 'имя', 'fio']) || '-';
                const department = findValue(row, ['бўлим', 'отдел', 'цех', 'департамент', 'отделение', 'служба']) || '-';
                const hoursVal = findValue(row, ['соат', 'часы', 'hours', 'ишсоат', 'отработанно', 'ишсоати', 'время', 'duration']);
                const hours = parseHours(hoursVal);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/40 transition text-gray-300 border-b border-gray-800/50";
                
                tr.innerHTML = `
                    <td class="p-3 font-mono text-gray-400">${id}</td>
                    <td class="p-3 font-medium text-white">${fio}</td>
                    <td class="p-3 text-gray-400">${department}</td>
                    <td class="p-3"><span class="bg-gray-800 px-2.5 py-1 rounded text-blue-400 font-mono font-semibold">${hours} соат</span></td>
                    <td class="p-3"><span class="inline-flex items-center text-red-400 font-medium">⚠️ Кам ишлаган</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Экспорт Excel
        function downloadFiltered() {
            if (globalFilteredData.length === 0) {
                alert("Юклаб олиш учун маълумот йўқ!");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(globalFilteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.book_append_sheet(workbook, worksheet, "Кам ишлаганлар");
            XLSX.writeFile(workbook, "skud_kam_ishlaganlar.xlsx");
        }
    </script>
</body>
</html>
