<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>СКУД - Тезкор Фильтрлаш</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <input type="file" id="fileInput" class="col-span-2 bg-gray-800 p-3 rounded-lg border border-gray-700 cursor-pointer" />
            <button onclick="loadFast()" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-bold">✅ 1. Тасдиқлаш</button>
            <button id="filterBtn" onclick="filterFast()" disabled class="bg-blue-600 py-3 rounded-lg opacity-50 cursor-not-allowed font-bold">🔍 2. Фильтрлаш</button>
        </div>
        
        <table class="w-full text-left bg-gray-800 rounded-xl overflow-hidden shadow-xl">
            <thead class="bg-gray-700 text-gray-300 text-xs uppercase">
                <tr><th class="p-4">ИД</th><th class="p-4">Ходим</th><th class="p-4">Соат</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let data = [];
        let filtered = [];

        // 1. Тезкор файл ўқиш
        function loadFast() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Файл танланг!");
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const wb = XLSX.read(e.target.result, {type: 'array'});
                data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                document.getElementById('filterBtn').disabled = false;
                document.getElementById('filterBtn').classList.replace('opacity-50', 'opacity-100');
                document.getElementById('filterBtn').classList.remove('cursor-not-allowed');
                alert("Маълумот юкланди: " + data.length + " қатор.");
            };
            reader.readAsArrayBuffer(file);
        }

        // 2. Тезкор фильтрлаш
        function filterFast() {
            let map = {};
            data.forEach(r => {
                let name = r['Person Name'] || r['ФИО'] || r['Исм'];
                let time = new Date(r['Time'] || r['Вақт']);
                let id = r['ID'] || r['Табель'];
                
                if(!name || isNaN(time)) return;
                if(!map[name]) map[name] = {min: time, max: time, id: id};
                else {
                    if(time < map[name].min) map[name].min = time;
                    if(time > map[name].max) map[name].max = time;
                }
            });

            filtered = Object.keys(map).map(n => {
                let hours = (map[n].max - map[n].min) / 3600000;
                return {id: map[n].id, name: n, hours: hours.toFixed(1)};
            }).filter(i => i.hours < 8);

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = filtered.map(i => `
                <tr class="border-t border-gray-700">
                    <td class="p-4">${i.id}</td>
                    <td class="p-4">${i.name}</td>
                    <td class="p-4 text-red-400 font-bold">${i.hours} соат</td>
                </tr>`).join('');
        }
    </script>
</body>
</html>
